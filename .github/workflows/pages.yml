name: Publish site

# Publishes site/ to GitHub Pages: the wallet approval-sheet identity
# (APP_IDENTITY in src/solana/config.ts → icon.png) and the privacy / terms
# pages the app links to (src/utils/legal.ts). Needs Pages enabled with
# "GitHub Actions" as the source (Settings → Pages); on a free plan the repo
# must be public.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
